experiment_id: fifa_property_synthetic_v1
status: retired_as_brand_counterfactual_mechanism_only

inputs:
  exposure: data/curated/experimental/sponsorship_monetization_v1/exposure_adstock_weekly.parquet
  property_taxonomy: data/reference/property_taxonomy.csv
  trends: data/curated/trends/trends_weekly_averaged.parquet

treatment:
  event_id: fifa_partner_announcement_2024
  first_full_post_week: 2024-10-21

treated_unit:
  exposure_property_group: fifa
  primary_outcome_query: cobrand_fifa
  secondary_post_only_query: cobrand_fcwc

donor_units:
  - {property_id: f1, outcome_query: cobrand_f1}
  - {property_id: motogp, outcome_query: cobrand_motogp}
  - {property_id: ducati, outcome_query: cobrand_ducati}

suppression:
  base_fill_value: 0.5
  sensitivity_fill_values: [0.0, 0.5, 1.0]
  interpretation: midpoint of Google Trends below-detection interval; sensitivity spans lower and upper bounds

quality_screen:
  maximum_pre_rmspe_z: 0.75
  target_minimum_donors: 9
  maximum_placebo_p_value: 0.10

interpretation:
  outcome: property_attributed_search_salience
  permitted_use: mechanism_diagnostic_only
  prohibited_claims: [brand_index_counterfactual, broad_brand_index_effect, causal_sponsorship_effect, monetary_value]

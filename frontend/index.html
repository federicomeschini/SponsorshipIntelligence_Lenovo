<!doctype html>
<!-- ============================================================================
     FIFA Partnership Intelligence — landing page (FE-009)
     Static, no build step: runs from file://, `npx serve`, or GitHub Pages.
     The Lenovo programme opens the EROI case dashboard (lenovo.html).
     ============================================================================ -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FIFA Partnership Intelligence · OpenEconomics</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="ds-kit/fonts.css">
<link rel="stylesheet" href="ds-kit/colors_and_type.css">
<link rel="stylesheet" href="ds-kit/components.css">
<link rel="stylesheet" href="styles/app.css">
</head>
<body class="is-landing">
<div class="oe-shell">
  <div class="dash-main">
    <main class="dash-body" id="screen" aria-live="polite"></main>
  </div>
</div>
<script>
  /* Old links into the retired screens (#/overview, #/return, …) land on the Lenovo case. */
  if (/^#\/(overview|return|proof|reach|attention|perception|about)/.test(location.hash)) location.replace("lenovo.html");
</script>
<script src="js/landing.js"></script>
</body>
</html>

experiment_id: sponsorship_total_effect_share_of_search_v1
status: search_component_check_ADR_0040
# Outcome: Lenovo Google share of search alone (% of base), the comparable component of the factor index.

inputs:
  brand_index: data/curated/index/brand_index_weekly.parquet
  jointly_scaled_donor_trends: data/curated/trends/jointly_scaled_donor_trends.parquet
  donor_registry: data/reference/counterfactual_donor_registry.csv
outcome_column: signal_google_share_of_search

# Donors on the same basis as Lenovo: log(donor) - log(sum of base rivals without
# that donor). Lenovo is in no denominator (ADR-0039).
donor_share_of_search:
  denominator_policies: [base]

treatment:
  first_full_post_week: 2024-10-21
provisional_trailing_weeks: 2

# Phase A: design selection on pre-announcement weeks only. The selection
# code receives a panel already truncated before the treatment week.
selection:
  methods: [simplex_scm, augmented_scm, synthetic_did, generalized_scm_factor]
  donor_pools:
    base: registry inclusion_policy == base
    base_plus_sensitivity: base plus registry sensitivity donors (Huawei, MSI)
    parallel_trend_screened: base donors whose pre-period gap to Lenovo has no linear trend (|HAC t| < 2)
    expanded: base plus the 16 screened ADR-0035 candidates
    expanded_plus_sensitivity: expanded plus Huawei and MSI
    expanded_parallel_trend_screened: parallel-trend screen applied to base and candidates
  include_candidate_pools: true
  parallel_trend_screen:
    max_abs_t: 2.0
    hac_lags: 4
    minimum_donors: 5
  rolling_origin:
    horizon_weeks: 16
    first_origin_week: 82          # leaves >= 52 training weeks for the ridge inner split
    step_weeks: 16
  criterion: lowest root-mean-square out-of-sample error across folds (Index points)
  tie_break_order: [simplex_scm, synthetic_did, augmented_scm, generalized_scm_factor]

# Phase B: one estimate with the selected design.
estimand: mean_post_gap_index_points     # sustained level, provisional weeks excluded
inference:
  primary: {statistic: rmspe_ratio, placebo_filter: none, window: all_post}   # unchanged from sponsorship_counterfactual_v1
  secondary_statistics:
    rmspe_ratio: two-sided post/pre RMSPE ratio (Abadie et al. 2010)
    mean_gap_over_pre_rmspe: one-sided post mean gap / pre RMSPE (sustained positive level shift)
  secondary_placebo_filters: {pre_rmspe_5x: 5.0, pre_rmspe_2x: 2.0}
  secondary_windows:
    excluding_spring_2026_surge: [2026-03-16, 2026-06-07]
    before_spring_2026_surge_end: 2026-03-15
  significance_level: 0.10

# Estimator settings reuse the World Cup engine rules (ADR-0029).
estimation:
  ascm:
    ridge_lambda_multipliers: [0.0001, 0.0003, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3, 1, 3, 10, 30, 100]
    inner_validation_weeks: 26
  category_shock_robustness:
    max_factors: 5
    cv_block_weeks: 13

outputs:
  directory: data/curated/experimental/sponsorship_total_effect_share_of_search_v1

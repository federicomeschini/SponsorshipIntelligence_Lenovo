name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Publish only what the browser needs: no build scripts, decision logs or shortcuts.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp frontend/index.html frontend/lenovo.html frontend/404.html frontend/.nojekyll _site/
          cp -r frontend/js frontend/styles frontend/data frontend/ds-kit frontend/vendor frontend/assets _site/
          test -f _site/data/eroi-data.js

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
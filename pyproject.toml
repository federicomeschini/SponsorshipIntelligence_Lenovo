[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "srmp"
version = "0.1.0"
description = "Sponsorship ROI Measurement Platform"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "pyarrow>=16,<24",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11,<2",
]

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"
addopts = "--basetemp=.cache/pytest-tmp"
[tool.setuptools.packages.find]
include = ["srmp*"]



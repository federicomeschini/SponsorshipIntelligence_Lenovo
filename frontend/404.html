<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIFA Partnership Intelligence · OpenEconomics</title>
<meta name="robots" content="noindex">
<script>
  /* GitHub Pages serves this for unknown paths: send the visitor to the landing page,
     keeping the project-site base path (https://<user>.github.io/<repo>/). */
  (function () {
    var parts = location.pathname.split("/").filter(Boolean);
    var base = location.hostname.endsWith("github.io") && parts.length ? "/" + parts[0] + "/" : "/";
    location.replace(base + "index.html");
  })();
</script>
</head>
<body><p><a href="index.html">FIFA Partnership Intelligence</a></p></body>
</html>

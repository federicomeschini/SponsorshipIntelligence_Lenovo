experiment_id: sponsorship_monetization_v1
status: experimental_not_canonical

inputs:
  exposure: data/staged/blinkfire/blinkfire_exposure_weekly.parquet
  survey_lift: data/staged/survey/sponsorship_funnel_lift.parquet
  brand_index: data/curated/index/brand_index_weekly.parquet

survey:
  stages: [appeal, purchase_intent]
  comparable_scale_version: 2025plus_categorical
  awareness_policy: exclude_mechanical_segment_definition

exposure:
  delta: 0.80
  delta_status: fixed_experimental_scenario_not_estimated
  measure: impressions
  confirmed_scope: impressions_views_only

alignment:
  trailing_weeks: 13
  fieldwork_date_policy: reported_month_end_proxy

# These fields are intentionally null. The experiment emits no monetary result
# until every value is explicitly approved or independently estimated.
valuation:
  scenario_id: experimental_base
  counterfactual_manifest: data/curated/experimental/sponsorship_total_effect_v1/estimate_manifest.json   # headline (ADR-0041)
  use_counterfactual_candidate: false   # owner approval required, even when the placebo test passes
  delta_index_attrib: null
  royalty_schedule_path: config/royalty_schedule.yaml
  royalty_reference_index: null
  royalty_bps_per_index_point: null
  brand_attributable_revenue: null
  sponsorship_fee: null
  discount_rate: null
  persistence_years: null
